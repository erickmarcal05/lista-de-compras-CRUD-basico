<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de tarefas</title>
    <link rel="stylesheet" href="css/index.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="logo">
            <img src="assets/img/logo.svg" alt="">
        </div>
    </header>

    <main>
        <div class="back">
            <a href="">
                <img src="assets/img/back-svgrepo-com.svg" alt="">
                <span>Voltar</span>
            </a>
        </div>

        <section class="form-wrapper">
            <h1>Compras da semana</h1>

            <form action="" method="get">

                <div class="add-item-container">
                    <input type="text" name="add-item-input" id="add-item-input" placeholder="Adicione um novo item">
                    <button type="submit" class="btn-add-item">Adicionar item</button>
                </div>

                <div class="items-of-list">

                    <div class="items">
                        <div>
                            <input type="checkbox" name="items" id="item1"></input>
                            <p>Pão de forma</p>
                        </div>

                        <button>
                            <img src="assets/img/Frame (3).svg" alt="">
                        </button>
                    </div>

                    <div class="items">
                        <div>
                            <input type="checkbox" name="items" id="item1"></input>
                            <p>Café preto</p>
                        </div>

                        <button>
                            <img src="assets/img/Frame (3).svg" alt="">
                        </button>
                    </div>

                    <div class="items">
                        <div>
                            <input type="checkbox" name="items" id="item1"></input>
                            <p>Suco de laranja</p>
                        </div>

                        <button>
                            <img src="assets/img/Frame (3).svg" alt="">
                        </button>
                    </div>

                    <div class="items">
                        <div>
                            <input type="checkbox" name="items" id="item1"></input>
                            <p>Biscoito</p>
                        </div>

                        <button>
                            <img src="assets/img/Frame (3).svg" alt="">
                        </button>
                    </div>
                    
                </div>
            </form>

        </section>
    </main>
</body>

<footer>
    
</footer>

</html>

<!-- 
aprendizados:
nao coloacar 90% no input, colocar 100 no body e o input vai ficar todo e só colocar padding dos lados

O jeito correto é usar uma <label> ligada ao checkbox. Assim, ao clicar no texto ou na área da label, o checkbox é marcado automaticamente.
-->
